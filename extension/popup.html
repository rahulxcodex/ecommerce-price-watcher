<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PriceWatcher</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 4px 0;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 12px 0;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #10b981;
    }
    button {
      width: 100%;
      background: #10b981;
      color: #022c22;
      border: none;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #059669;
    }
    button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    #status {
      font-size: 11px;
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .url-preview {
      font-size: 10px;
      color: #64748b;
      word-break: break-all;
      background: #020617;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 12px;
      max-height: 40px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h2>📉 PriceWatcher Companion</h2>
  <p>Track this product in your personal dashboard</p>

  <div id="url-box" class="url-preview">Detecting product URL...</div>

  <label for="targetPrice">Target Price in ₹ (Optional)</label>
  <input type="number" id="targetPrice" placeholder="e.g. 1499">

  <label for="appUrl">Tracker API URL</label>
  <input type="text" id="appUrl" value="https://ecommerce-price-watcher-puce.vercel.app">

  <button id="trackBtn">🚀 Track This Product</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
