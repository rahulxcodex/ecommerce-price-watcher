name: Automated Price Watcher Cron

on:
  schedule:
    # High-frequency 30-minute schedule: supports 6-hour emergency catch-up and 4-hour cycle
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run regardless of staleness'
        required: false
        default: 'false'
        type: string

concurrency:
  group: price-check-cron
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Preflight Staleness & Emergency Catch-up Check
        id: preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: node scripts/check-staleness.mjs

      - name: Install Dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: npm ci --no-fund --no-audit

      - name: Cache Playwright Binaries
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.preflight.outputs.should_run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Price Checker
        if: steps.preflight.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPSCRIPT_EMAIL_URL: ${{ secrets.APPSCRIPT_EMAIL_URL }}
          APPSCRIPT_API_KEY: ${{ secrets.APPSCRIPT_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          APPSCRIPT_TO_EMAIL: ${{ secrets.APPSCRIPT_TO_EMAIL }}
          SCRAPER_ALERT_EMAIL: ${{ secrets.SCRAPER_ALERT_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          echo "🚀 Executing price check cycle [Mode: ${{ steps.preflight.outputs.mode }}]..."
          for attempt in 1 2; do
            echo "Attempt $attempt of 2..."
            if npm run scrape; then
              echo "✅ Scraper run succeeded on attempt $attempt."
              exit 0
            fi
            echo "⚠️ Attempt $attempt failed. Waiting 30s before retry..."
            sleep 30
          done
          echo "❌ Scraper failed across all retry attempts."
          exit 1
